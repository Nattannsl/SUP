<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📋 General Dashboard</h1>
      <button id="toggle-layout-btn" class="btn-layout">
        <span>↔️</span> Modo Paisagem (Kanban)
      </button>
    </header>

    <section class="card-form">
      <h2>Novo Item / Tarefa</h2>
      <form id="attendance-form">
        <input type="text" id="client-name" placeholder="Título ou Nome" required autocomplete="off">
        <input type="text" id="client-desc" placeholder="Descrição ou Detalhes" autocomplete="off">
        <select id="card-status">
          <option value="pendencia">📌 Pendência</option>
          <option value="espera">⏳ Espera</option>
          <option value="atendimento">🔄 Em Andamento</option>
          <option value="concluido">✅ Concluído</option>
        </select>
        <button type="submit">+ Adicionar</button>
      </form>
    </section>

    <main id="board" class="board grid-mode">
      <!-- Coluna Pendência -->
      <div class="column" id="col-pendencia" 
           ondragover="allowDrop(event)" 
           ondragleave="removeDropStyle(event)" 
           ondrop="dropTask(event, 'pendencia')">
        <h3>📌 Pendências</h3>
        <div class="cards-container" id="container-pendencia"></div>
      </div>

      <!-- Coluna Espera -->
      <div class="column" id="col-espera" 
           ondragover="allowDrop(event)" 
           ondragleave="removeDropStyle(event)" 
           ondrop="dropTask(event, 'espera')">
        <h3>⏳ Em Espera</h3>
        <div class="cards-container" id="container-espera"></div>
      </div>

      <!-- Coluna Em Andamento -->
      <div class="column" id="col-atendimento" 
           ondragover="allowDrop(event)" 
           ondragleave="removeDropStyle(event)" 
           ondrop="dropTask(event, 'atendimento')">
        <h3>🔄 Em Andamento</h3>
        <div class="cards-container" id="container-atendimento"></div>
      </div>

      <!-- Coluna Concluído -->
      <div class="column" id="col-concluido" 
           ondragover="allowDrop(event)" 
           ondragleave="removeDropStyle(event)" 
           ondrop="dropTask(event, 'concluido')">
        <h3>✅ Concluído</h3>
        <div class="cards-container" id="container-concluido"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
